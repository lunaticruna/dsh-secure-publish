name: Verify plugin and protocol
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install official distro crypto tools
        run: sudo apt-get update && sudo apt-get install -y age minisign
      - run: npm run check
      - run: npm test
        env:
          REQUIRE_CRYPTO: '1'
      - run: npm pack --ignore-scripts
